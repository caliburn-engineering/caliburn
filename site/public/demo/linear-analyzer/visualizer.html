<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"name=viewport><title>Linear System Analyzer — Caliburn</title><style>*{margin:0;padding:0;box-sizing:border-box}body,html{width:100%;height:100%;overflow:hidden;background:#14141a}#canvas{display:block;width:100vw;height:100vh;outline:0}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14141a;color:#a0a0b0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;z-index:10;transition:opacity .3s}#loading h1{font-size:1.3rem;margin-bottom:1rem;color:#e0e0f0}#progress-bar{width:240px;height:6px;background:#2a2a3a;border-radius:3px;overflow:hidden}#progress-fill{height:100%;width:0%;background:#38bdf8;border-radius:3px;transition:width .15s}#status{margin-top:.6rem;font-size:.85rem}</style></head><body><div id=loading><h1>Linear System Analyzer</h1><div id=progress-bar><div id=progress-fill></div></div><div id=status>Loading...</div></div><canvas id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><script>

var Module={preRun:[function(){FS.writeFile("/imgui.ini",CALIBURN_LAYOUT)}],canvas:document.getElementById("canvas"),setStatus:function(e){var t=document.getElementById("status");t&&(t.textContent=e);var n=e.match(/([0-9.]+)\/([0-9.]+)/);if(n){var i=(parseFloat(n[1])/parseFloat(n[2])*100).toFixed(0),a=document.getElementById("progress-fill");a&&(a.style.width=i+"%")}if(""===e){var d=document.getElementById("loading");d&&(d.style.opacity="0",setTimeout((function(){d.style.display="none"}),300))}},onRuntimeInitialized:function(){resizeCanvas()}};function resizeCanvas(){var e=document.getElementById("canvas"),t=window.devicePixelRatio||1;e.width=window.innerWidth*t,e.height=window.innerHeight*t}window.addEventListener("resize",resizeCanvas)</script><script async src=visualizer.js></script></body></html>
